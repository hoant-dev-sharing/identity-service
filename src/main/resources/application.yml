server:
  port: 8001

spring:
  application:
    name: identity-service
  datasource:
    url: jdbc:mysql://localhost:3308/identity_service
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true